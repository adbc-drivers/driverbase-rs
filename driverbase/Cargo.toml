[package]
name = "driverbase"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
telemetry = [
    "dep:chrono",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry_sdk",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:uuid",
]

[dependencies]
adbc_core = ">=0.24.0,<0.26.0"
arrow-array = ">=58.3,<61"
arrow-buffer = ">=58.3,<61"
arrow-schema = ">=58.3,<61"
chrono = { version = "0.4", optional = true }
# tracing-opentelemetry 0.31 pairs with opentelemetry 0.30. A driver whose own
# dependencies trace through OpenTelemetry must resolve the same versions to
# share one subscriber and parent context with these spans.
opentelemetry = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry-semantic-conventions = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.31", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
